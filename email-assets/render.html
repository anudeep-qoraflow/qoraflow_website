<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qoraflow email image renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
</head>
<body>
<pre id="out"></pre>
<script>
// Draws the email images with the same code as the Qoraflow Business Card page
// (logo mark, glowing core, wordmark, card front). Run with headless Chrome:
//   email-assets/build.sh
// It prints each PNG as base64 into <pre id="out">, and build.sh saves them to /email.
(async () => {
const OR = '#FF9F1C', BL = '#3DB8FF';
const CARD = { name: 'Anudeep Cherukupalli', title: 'Founder', email: 'contact@qoraflow.com', phone: '', web: 'qoraflow.com' };

const markSVG = (check, bg) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">${bg ? `<rect width="120" height="120" rx="28" fill="${bg}"/>` : ''}<circle cx="60" cy="60" r="47" fill="none" stroke="${OR}" stroke-width="3" stroke-dasharray="3 6"/><circle cx="60" cy="60" r="40" fill="none" stroke="${BL}" stroke-width="6" stroke-dasharray="58 17 22 17" stroke-linecap="round" transform="rotate(-20 60 60)"/><circle cx="60" cy="60" r="29" fill="none" stroke="${OR}" stroke-width="5" stroke-dasharray="34 11" stroke-linecap="round" transform="rotate(40 60 60)"/><polyline points="49,61 57,68 71,53" fill="none" stroke="${check}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const uri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function core(ctx, cx, cy, R, s, alpha) {
  const r = rng(7); ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.7); g.addColorStop(0, 'rgba(255,244,214,.95)'); g.addColorStop(.3, 'rgba(255,200,97,.5)'); g.addColorStop(1, 'rgba(255,159,28,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.7, 0, 7); ctx.fill();
  const rings = [[1.75, 1, [2, 10], OR, .35], [1.42, 2.2, [2, 5], BL, .7], [1.26, 3, [24, 10, 6, 12], OR, .85], [1.02, 2, [40, 14], BL, .8], [.78, 2.4, [30, 10], OR, .85], [2.4, 1.5, [40, 18, 6, 18], BL, .25]];
  for (const [k, w, d, c, a] of rings) { ctx.setLineDash(d.map(v => v * s)); ctx.lineWidth = w * s; ctx.strokeStyle = c; ctx.globalAlpha = alpha * a; ctx.beginPath(); ctx.arc(cx, cy, R * k, 0, 7); ctx.stroke(); }
  ctx.setLineDash([]); ctx.lineCap = 'round'; ctx.shadowBlur = 8 * s;
  for (let i = 0; i < 170; i++) { const a = r() * 6.283, rr = R * (0.2 + r() * 1.05), l = (4 + r() * 16) * s, c = r() < .5 ? OR : BL; ctx.shadowColor = c; ctx.strokeStyle = c; ctx.globalAlpha = alpha * (.35 + r() * .65); ctx.lineWidth = (1 + r() * 2.2) * s; const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr, ta = a + 1.5708; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ta) * l, y + Math.sin(ta) * l); ctx.stroke(); }
  ctx.restore();
}
function wordmark(ctx, x, y, size, ink, align) {
  ctx.font = `800 ${size}px Manrope, system-ui, sans-serif`; ctx.textBaseline = 'alphabetic';
  const a = ctx.measureText('Qora').width, b = ctx.measureText('flow').width, w = a + b;
  const sx = align === 'center' ? x - w / 2 : x; ctx.textAlign = 'left';
  ctx.fillStyle = ink; ctx.fillText('Qora', sx, y); ctx.fillStyle = OR; ctx.fillText('flow', sx + a, y); return w;
}
function drawFront(ctx, W, H, M) {
  const s = W / 1050; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(W * .84, H * .55, 0, W * .84, H * .55, W * .5); gl.addColorStop(0, 'rgba(255,159,28,.16)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  core(ctx, W * .86, H * .56, 190 * s, s, 1);
  const fade = ctx.createLinearGradient(0, 0, W * .66, 0); fade.addColorStop(0, 'rgba(0,0,0,.92)'); fade.addColorStop(.75, 'rgba(0,0,0,.6)'); fade.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = fade; ctx.fillRect(0, 0, W * .66, H);
  ctx.drawImage(M.dark, 64 * s, 58 * s, 58 * s, 58 * s); wordmark(ctx, 136 * s, 100 * s, 34 * s, '#fff');
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `800 ${50 * s}px Manrope, system-ui, sans-serif`; ctx.fillText(CARD.name, 64 * s, 300 * s);
  ctx.fillStyle = OR; ctx.font = `700 ${24 * s}px Manrope, system-ui, sans-serif`; ctx.fillText((CARD.title ? CARD.title + ', ' : '') + 'Qoraflow', 64 * s, 342 * s);
  const lines = [['Email', CARD.email], ['Phone', CARD.phone], ['Web', CARD.web]].filter(l => l[1]);
  let y = 600 * s - 60 * s - (lines.length - 1) * 36 * s;
  for (const [l, v] of lines) { ctx.fillStyle = BL; ctx.font = `800 ${14 * s}px Manrope, system-ui, sans-serif`; ctx.fillText(l.toUpperCase(), 64 * s, y); ctx.fillStyle = '#D5DEEC'; ctx.font = `600 ${21 * s}px Manrope, system-ui, sans-serif`; ctx.fillText(v, 150 * s, y); y += 36 * s; }
}
// Hero: the glowing core with the logo mark in the middle, on black.
function drawHero(ctx, W, H, M) {
  const s = W / 1200; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  core(ctx, W / 2, H / 2, 150 * s, s, .9);
  const v = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .55); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(.55, 'rgba(0,0,0,.2)'); v.addColorStop(1, 'rgba(0,0,0,.95)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const m = 170 * s; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.arc(W / 2, H / 2, m * .62, 0, 7); ctx.fill();
  ctx.drawImage(M.dark, W / 2 - m / 2, H / 2 - m / 2, m, m);
}
// Header lockup: mark + wordmark on black.
function drawLockup(ctx, W, H, M) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const m = H * .62, x = H * .19; ctx.drawImage(M.dark, x, (H - m) / 2, m, m); wordmark(ctx, x + m + H * .14, H * .64, H * .46, '#fff');
}
function lockupW(H) { const c = document.createElement('canvas').getContext('2d'); c.font = `800 ${H * .46}px Manrope, system-ui, sans-serif`; return Math.ceil(H * .19 + H * .62 + H * .14 + c.measureText('Qoraflow').width + H * .19); }

const out = {};
try {
  await document.fonts.load('800 40px Manrope'); await document.fonts.load('700 20px Manrope'); await document.fonts.load('600 20px Manrope');
  const M = {};
  M.dark = await loadImg(uri(markSVG('#FFFFFF')));
  const make = (name, w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h, M); out[name] = c.toDataURL('image/png').split(',')[1]; };
  make('card-front.png', 1200, Math.round(1200 * 600 / 1050), drawFront);
  make('hero.png', 1200, 520, drawHero);
  make('logo-lockup.png', lockupW(132), 132, drawLockup);
  const icon = (ctx, W, H) => { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(0, 0, W, H, W * .23); ctx.fill(); ctx.drawImage(M.dark, W * .1, W * .1, W * .8, W * .8); };
  make('icon.png', 144, 144, icon);
  out.__fonts = document.fonts.check('800 40px Manrope') ? 'manrope-ok' : 'manrope-MISSING';
} catch (e) { out.__error = String(e); }
document.getElementById('out').textContent = JSON.stringify(out);
})();
</script>
</body>
</html>
